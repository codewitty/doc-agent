# Scheduled regression run against the real model. Each case runs three
# times so a single unlucky sample does not fail the build, and the report
# lists cases that pass only some of the time. Also catches silent
# provider-side model changes, since nothing in the repo has to change.
name: Nightly eval (OpenAI)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeats per case
        default: "3"

jobs:
  eval:
    runs-on: ubuntu-latest
    if: ${{ vars.OPENAI_EVALS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m evals.run --model openai --repeats "${{ inputs.repeats || '3' }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: cat reports/eval/summary.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-openai-${{ github.run_id }}
          path: reports/eval/
          retention-days: 30
