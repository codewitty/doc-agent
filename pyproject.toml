[project]
name = "doc-agent"
version = "0.1.0"
description = "Document Q&A agent with tool use, operator approval and an evaluation harness"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "openai>=1.50",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2", "pgvector>=0.3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "playwright>=1.45",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m \"not e2e\" --junitxml=reports/junit.xml"
markers = [
  "e2e: browser tests that start a live server (run with -m e2e)",
  "postgres: contract tests that need DATABASE_URL_TEST",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["doc_agent", "tests", "evals"]  # ruff format owns line length; long strings are left whole

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["doc_agent"]
mypy_path = "src"
ignore_missing_imports = true
